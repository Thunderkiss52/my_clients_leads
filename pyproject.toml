[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-clients-leads"
version = "0.1.0"
description = "Lead scraper for Google Maps and Yandex Maps with CSV export and website scoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.54.0"]

[project.scripts]
my-clients-leads = "my_clients_leads.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
